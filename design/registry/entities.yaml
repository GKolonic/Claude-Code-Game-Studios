# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /architecture-review (data structure and interface validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="referenced_by.*inventory"
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised

version: 1
last_updated: "2026-04-20"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: conversion_fraction
    status: active
    source: design/gdd/hud-progress-system.md
    referenced_by:
      - design/gdd/hud-progress-system.md
    variables:
      - converted_count
      - total_npc_count
    output_range: [0.0, 1.0]
    expression: "converted_count / total_npc_count"
    notes: "HUD F1 — read-only re-derivation for the chronicle card's souls line ('N of M
      souls'); the GSM owns win/loss evaluation (its Formula 1, >= inclusive). Never rendered
      as a percentage numeral. total_npc_count = 0 unreachable (GSM EC-1 rejects zero-NPC
      villages at initialize_village())."
    added: 2026-08-09
    revised: ""

  - name: rival_activity_rate
    status: active
    source: design/gdd/hud-progress-system.md
    referenced_by:
      - design/gdd/hud-progress-system.md
    variables:
      - W
      - turn_i
      - n
      - count
      - rate
      - gauge
    output_range: ["QUIET", "ACTIVE"]
    expression: "W = GameConfig.rival.aggression_interval_turns; stamp turn_i on rival_acted; prune turn_i <= n - W on turn_advanced(n); count = clamp(stamps.size(), 0, W); rate = count / W; gauge = QUIET if count == 0 else ACTIVE"
    notes: "HUD F2 — presence gauge, not a pressure percentage (one rival at MVP makes rate
      near-binary). W default 6 per game-config.md; RFS GDD lists 3 — discrepancy flagged for
      /consistency-check (2026-08-09), HUD reads the field at call time."
    added: 2026-08-09
    revised: ""

  - name: chronicle_card_alpha
    status: active
    source: design/gdd/hud-progress-system.md
    referenced_by:
      - design/gdd/hud-progress-system.md
    variables:
      - t
      - D_in
      - D_hold
      - D_fade
      - D_total
    output_range: [0.0, 1.0]
    expression: "a(t) = t/D_in for 0 <= t < D_in; 1 for D_in <= t < D_in + D_hold; 1 - (t - D_in - D_hold)/D_fade for D_in + D_hold <= t <= D_total; 0 for t > D_total; D_in = 0.25s; D_hold = GameConfig.hud.chronicle_card_hold_sec (4.0s); D_fade = GameConfig.hud.chronicle_card_fade_ms / 1000.0 (0.4s)"
    notes: "HUD F3 — chronicle card alpha envelope (modulate.a, linear ramps only). Applied
      identically to WON and LOST cards. Reduced-motion override: skip D_in, hold, fade over
      HUDConfig.reduced_motion_card_fade_ms (100ms); shimmer disabled. Card non-interactive."
    added: 2026-08-09
    revised: ""

# Example:
#
# formulas:
#   - name: damage_formula
#     status: active
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/progression.md   # progression GDD scales attack variable
#     variables:
#       - attack
#       - defense
#       - crit_chance
#       - crit_multiplier
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     notes: "Output feeds into health-system damage intake. Min is 0 (armour
#       can absorb all damage). Max is uncapped in formula but tuning knob
#       damage_cap in combat.md clamps at 999."
#     added: 2026-03-26
#     revised: ""


# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: GameConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
    value: "Autoload singleton"
    unit: "GDScript Autoload"
    notes: "Single access point for all tuning values. All gameplay systems call
      GameConfig.[domain].[field] — never read .tres files directly."
    added: 2026-04-20
    revised: ""

  - name: ConversionConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
      - design/gdd/dialogue-content-database.md
    value: "res://assets/data/config/conversion_config.tres"
    unit: "Resource path"
    notes: "Domain: base_success_chance, trait_modifier_weight, approach_cooldown_turns,
      hard_mode_base_modifier, max_approaches_per_npc. Consumed by Conversion Logic Engine."
    added: 2026-04-20
    revised: ""

  - name: ConversionOutcome
    status: active
    source: design/gdd/dialogue-content-database.md
    referenced_by:
      - design/gdd/dialogue-content-database.md
      - design/gdd/rival-faith-system.md
    value: "PERSUADED | SOFTENED | RESISTED | HARDENED"
    unit: "GDScript enum"
    notes: "Canonical 4-value enum for conversion attempt results. Owned by Dialogue Content
      Database. Referenced by Dialogue & Conversion System (outcome resolution), Conversion
      Logic Engine (output type), Conversion UI (outcome display), Rival Faith System (rival
      outcome application). CONVERTED was renamed to PERSUADED (flagged in NPC Character
      System GDD Rule 9) to eliminate naming collision with BeliefState.CONVERTED.
      All systems must use these four values — do not add variants without updating this registry."
    added: 2026-04-20
    revised: "2026-04-26"

  - name: DialogueDatabase
    status: active
    source: design/gdd/dialogue-content-database.md
    referenced_by:
      - design/gdd/dialogue-content-database.md
    value: "Autoload singleton"
    unit: "GDScript Autoload"
    notes: "Read-only content registry for all player-facing text. API: get_approach_lines(approach),
      get_outcome_summary(approach, outcome), get_npc_flavour(archetype), get_rival_lines(approach),
      is_loaded(). Loads from res://assets/data/dialogue/dialogue_database.tres at startup.
      Never call DialogueDatabase methods before is_loaded() returns true."
    added: 2026-04-20
    revised: ""

  - name: TraitConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
    value: "res://assets/data/config/trait_config.tres"
    unit: "Resource path"
    notes: "Domain: common/uncommon/rare trait weights, traits_per_npc min/max.
      Consumed by NPC Character System."
    added: 2026-04-20
    revised: ""

  - name: FaithSpreadConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
    value: "res://assets/data/config/faith_spread_config.tres"
    unit: "Resource path"
    notes: "Domain: passive_spread_radius, spread_rate_per_tick, attrition_rate_per_tick,
      spread_tick_interval_sec. Consumed by Faith Spread System."
    added: 2026-04-20
    revised: ""

  - name: RivalFaithConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
      - design/gdd/hud-progress-system.md
    value: "res://assets/data/config/rival_faith_config.tres"
    unit: "Resource path"
    notes: "Domain: aggression_interval_turns, reharden_strength, counter_approach_random_weight.
      Consumed by Rival Faith System. HUD reads aggression_interval_turns as its F2 window W.
      NOTE: aggression_interval_turns default is 6 here vs 3 in rival-faith-system.md — flagged
      for /consistency-check (2026-08-09), not edited."
    added: 2026-04-20
    revised: "2026-08-09"

  - name: ProgressionConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
      - design/gdd/game-state-manager.md
      - design/gdd/hud-progress-system.md
    value: "res://assets/data/config/progression_config.tres"
    unit: "Resource path"
    notes: "Domain: faith_power_per_conversion, missionary/court/crusade unlock thresholds,
      village_win_conversion_pct. Consumed by Multi-path Expansion System, Game State Manager,
      HUD & Progress System."
    added: 2026-04-20
    revised: "2026-08-09"

  - name: GameStateManager
    status: active
    source: design/gdd/game-state-manager.md
    referenced_by:
      - design/gdd/game-state-manager.md
    value: "Autoload singleton"
    unit: "GDScript Autoload"
    notes: "Turn lifecycle authority. Signals: village_ready, turn_advancing, turn_advanced,
      village_won, village_lost, faith_power_changed, village_clearing, village_cleared.
      API: request_end_turn(), get_turn_number(), get_faith_power(), get_gsm_state().
      Must be listed in Project Settings after NPCRegistry and DialogueConversionSystem."
    added: 2026-04-25
    revised: ""

  - name: GSMState
    status: active
    source: design/gdd/game-state-manager.md
    referenced_by:
      - design/gdd/game-state-manager.md
      - design/gdd/hud-progress-system.md
    value: "UNINITIALIZED | IDLE | IN_SESSION | TURN_ADVANCING | VILLAGE_WON | VILLAGE_LOST"
    unit: "GDScript enum"
    notes: "Six-state machine for the Game State Manager. Consumed by Village Map UI
      (End Turn button gating), HUD & Progress System (state display), and Save & Load
      System (save-state serialization and restoration). Referenced by get_gsm_state()."
    added: 2026-04-25
    revised: "2026-08-09"

  - name: UITimingConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
    value: "res://assets/data/config/ui_timing_config.tres"
    unit: "Resource path"
    notes: "Domain: dialogue_line_hold_sec, outcome_display_hold_sec, scene_transition_duration_sec,
      portrait_expression_hold_frames. Consumed by Dialogue & Conversion System, Conversion UI."
    added: 2026-04-20
    revised: ""

  - name: HUDConfig
    status: active
    source: design/gdd/game-config.md
    referenced_by:
      - design/gdd/game-config.md
      - design/gdd/hud-progress-system.md
    value: "res://assets/data/config/hud_config.tres"
    unit: "Resource path"
    notes: "9th config domain (added 2026-08-09 by the HUD & Progress System GDD). Domain:
      top_strip_height_dp, chronicle_card_hold_sec, chronicle_card_fade_ms,
      chronicle_card_fade_in_ms, reduced_motion_card_fade_ms. Consumed by HUD & Progress System;
      top_strip_height_dp is a cross-system layout contract consumed by Village Map View (F1)."
    added: 2026-08-09
    revised: ""

